<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>KEYMASTR — Prodesk</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      The same three faces Logo Studio uses — KEYMASTR wears that kit deliberately
      so the two apps read as siblings: Inter Tight (display + UI), Instrument
      Serif italic (the `.quill` editorial accent), JetBrains Mono (the `.spec`
      label and every number — counts, timestamps, fingerprints, TOTP).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin: 0; background-color: #0a0a09">
    <div id="root">
      <!-- Minimal loader while JS boots -->
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #0a0a09;
          color: #666;
          font-family: sans-serif;
          font-size: 14px;
        "
      >
        Loading…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
