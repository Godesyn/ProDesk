<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Logo — Prodesk</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The studio's own UI type. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter+Tight:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <!--
      The WORDMARK faces (modules/logo/typefaces.ts), for the inspector's typeface
      specimens and the brand-system type preview. Separate from the line above so
      the studio's own chrome isn't waiting on eight extra families: this @font-face
      sheet is tiny and the browser only fetches a family once something renders in
      it. Lockups themselves need none of this — their wordmark is outlined
      server-side — so a face that fails to load costs a specimen, never an export.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=DM+Sans:wght@400;700&family=Fraunces:wght@400;700&family=IBM+Plex+Sans:wght@400;600&family=Inter:wght@400;700;800&family=Source+Serif+4:wght@400;600&family=Space+Grotesk:wght@400;700&family=Work+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin: 0; background-color: #0a0a09">
    <div id="root">
      <!-- Minimal loader while JS boots -->
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #0a0a09;
          color: #666;
          font-family: sans-serif;
          font-size: 14px;
        "
      >
        Loading…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
