<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The mark first: it is scheme-aware (see public/chat.svg) so it stays
         legible in a light tab bar and a dark one. The PNG stays as the fallback
         for the handful of clients that ignore SVG icons. -->
    <link rel="icon" type="image/svg+xml" href="/chat.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <title>Chat — Prodesk</title>
    <meta name="theme-color" content="#101317" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      FOUR faces, four jobs, no overlap (DESIGN.md §1.3):

        Instrument Sans     human speech — message bodies, and ONLY message bodies
        Inter Tight         UI + display — names, headers, buttons, nav, counts
        JetBrains Mono      every number — timestamps, dates, sizes, receipts
        Instrument Serif    one editorial line per empty state (`.quill`)

      Instrument Sans is the third face this frontend adds to the house kit, and
      it is deliberately from the same superfamily as the house's Instrument
      Serif — a family decision, not an import. Every other Prodesk app sets its
      content in the same font as its buttons; a messenger's content is what
      people said to each other, and it earns a reading face.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=Inter+Tight:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <!-- Chat is dark-FIRST (DESIGN.md §1.3), so the pre-boot ground is the Night
       room colour. Booting a messenger into white and flipping to dark is the
       single most jarring flash in the suite. -->
  <body style="margin: 0; background-color: #101317">
    <div id="root">
      <!-- Minimal loader while JS boots -->
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #101317;
          color: #5f6772;
          font-family: sans-serif;
          font-size: 14px;
        "
      >
        Loading…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
